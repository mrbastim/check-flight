services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-check_flight}
      POSTGRES_USER: ${POSTGRES_USER:-check_flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-check_flight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://check_flight:check_flight@postgres:5432/check_flight?sslmode=disable}
    volumes:
      - ./flights.db:/app/flights.db
      - ./logs:/app/logs

volumes:
  postgres_data: